<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}课程书架{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
  <link rel="icon" href="/static/app.ico?v={{ static_version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script defer src="/static/app.js?v={{ static_version }}"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.2 5.3l3.8-1 3.1 15.5-3.9 1z"/></svg>
      课程书架
    </a>
    {% block nav %}{% endblock %}
    <span class="topbar-spacer"></span>
    {% set job_count = active_job_count() %}
    <a class="topbar-link{{ ' is-busy' if job_count }}" href="/jobs" id="jobs-badge">后台任务<span class="badge-count" id="jobs-count"{% if not job_count %} hidden{% endif %}>{{ job_count }}</span></a>
    <a class="topbar-link" href="/settings">设置</a>
  </nav>
  {% set flash = take_flash(request) %}
  {% if flash %}
  <div class="flash flash-{{ flash.kind }}" role="status">
    <span>{{ flash.message }}</span>
    <button class="flash-close" type="button" aria-label="关闭提示" data-dismiss>×</button>
  </div>
  {% endif %}
  {% block body %}{% endblock %}
  <dialog class="viewer" id="page-viewer" aria-label="课件页面">
    <form method="dialog" class="viewer-head">
      <span id="viewer-title"></span>
      <a id="viewer-open" href="#" target="_blank" rel="noopener">在新窗口打开</a>
      <button class="icon-button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>
    <img id="viewer-image" alt="">
  </dialog>
</body>
</html>
